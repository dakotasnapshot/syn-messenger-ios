<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName synmessenger.com
    ServerAlias www.synmessenger.com
    ServerAdmin webmaster@synmessenger.com

    DocumentRoot /var/www/synmessenger.com/web

    <Directory /var/www/synmessenger.com/web>
        Options +SymlinksIfOwnerMatch
        AllowOverride All
        Require all granted
        <FilesMatch ".+\.ph(p[345]?|t|tml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog /var/log/ispconfig/httpd/synmessenger.com/error.log
    CustomLog /var/log/ispconfig/httpd/synmessenger.com/access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/synmessenger.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/synmessenger.com/privkey.pem
</VirtualHost>
</IfModule>
