targets:
  SYN Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "11.5"
    sources:
    - path: ../Sources
    - path: ../Resources
    - path: ../../Components/SYNWatchTransport
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SYN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKCompanionAppBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: SYNWatch.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.syn.messenger.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).watch
        PRODUCT_NAME: SYNWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.2
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
    - target: SYN Watch Complications
      embed: true
    scheme: {}

  SYN Watch Complications:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.5"
    sources:
    - path: ../Complications
    info:
      path: Complications-Info.plist
      properties:
        CFBundleDisplayName: SYN Complications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SYNWatchComplications.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.syn.messenger.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).watch.complications
        PRODUCT_NAME: SYNWatchComplications
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6.2
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
